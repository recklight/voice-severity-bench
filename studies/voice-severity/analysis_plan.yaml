# Machine-readable analysis plan; analysis_plan.md is the authoritative text.
# Paths are relative to paper-voice-severity/.
plan_version: 1
status: frozen                   # draft | frozen
master_seed: 20261102

data:
  analysis_set: s1_segments/analysis_set.csv
  intervals: s1_segments/analysis_intervals.csv
  targets: s0_audit/out/targets.csv
  ratings_long: s0_audit/out/ratings_long.csv
  recordings: s0_audit/out/recordings.csv
  demographics: s0_audit/out/demographics_clean.csv
  audio_manifest: data/pvqd_manifest.json
  primary_set_column: primary_set
  expected_counts: {all: 296, primary: 287, groups: 278}
  channel_choice: {NYU1015: 1}   # 0-based; PT119 is averaged (D3)
  merged_groups:                 # D4; E5i undoes this
    - [PT052, PT099]
    - [PT032, PT097]
    - [PT006, PT078]
    - [PT109, PT120]
    - [PT042, PT044]
    - [PT013, PT122]
    - [PT054, PT100]
    - [PT020, PT034]
    - [PT031, PT056]
  recording_groups: [BL, LA, NYU, PT, SJ]

targets:
  primary: capev_severity
  secondary:
    - capev_roughness
    - capev_breathiness
    - capev_strain
    - capev_pitch
    - capev_loudness
    - grbas_grade
    - grbas_roughness
    - grbas_breathiness
    - grbas_asthenia
    - grbas_strain
  first_session_suffix: __session1
  smallest_meaningful_difference: 2.0   # CAPE-V points, primary target only

materials:
  primary: a
  exploratory: [i, sentences, whole]

audio:
  sample_rate: 16000
  rms_dbfs: -26.0
  crop_before_resampling: true

feature_sets:
  B0: {kind: mean_predictor, reference_only: true}
  M0:
    kind: metadata
    source: s0_audit/out/recordings.csv
    columns: [group_BL, group_LA, group_NYU, group_PT, group_SJ, is_25k, is_stereo,
              duration_s, rms_dbfs, noise_floor_dbfs]
  A1:
    kind: mfcc
    frontend: {delta_order: 0}   # every other frontend key at the package default
    pooling: [mean, std]
    n_columns: 26
  A2:
    kind: mfcc
    frontend: {delta_order: 2}
    pooling: [mean, std]
    n_columns: 78
  A3:
    kind: clinical
    backend: praat-parselmouth
    pitch: {method: cc, first_pass_hz: [50, 700], floor_factor: 0.75, ceiling_factor: 1.5}
    columns: [f0_mean_st, f0_sd_st, f0_range_st, voiced_fraction, voice_breaks_degree,
              jitter_local, jitter_local_abs, jitter_rap, jitter_ppq5, jitter_ddp,
              shimmer_local, shimmer_local_db, shimmer_apq3, shimmer_apq5, shimmer_apq11,
              shimmer_dda, hnr_mean_db, cpps_db]
    jitter_args: [0.0001, 0.02, 1.3]
    shimmer_args: [0.0001, 0.02, 1.3, 1.6]
    harmonicity_cc: {time_step: 0.01, silence_threshold: 0.1, periods_per_window: 1.0}
    cpps:
      power_cepstrogram: {pitch_floor: 60, time_step: 0.002, max_frequency: 5000, preemphasis_from: 50}
      time_averaging_window: 0.02
      quefrency_averaging_window: 0.0005
      peak_search_hz: [60, 330]
      tolerance: 0.05
      interpolation: parabolic
      trend_line: {quefrency_range: [0.001, 0.0], type: straight, fit: robust}
  A4: &ssl
    kind: ssl
    model: facebook/hubert-base-ls960
    n_hidden_states: 13
    pooling: [mean, std]
    avg_block: true              # frame-level mean over the 13 layers, then pooled
    chunk_s: 30.0
  A5: {<<: *ssl, model: microsoft/wavlm-base-plus}
  A6: {<<: *ssl, model: openai/whisper-small, encoder_only: true, truncate_to_input: true}

model:
  steps: [select_block, impute_median_with_indicator, standardize, ridge]
  ridge_alphas: {logspace: [-3, 7, 21]}
  inner_splits: 5
  inner_scoring: rmse

evaluation:
  outer_splits: 5
  n_repeats: 10
  split_seeds: repeat_seeds(master_seed, n_repeats)
  metrics: [rmse, mae, r2, pearson_r, spearman_rho, ccc]
  primary_metric: rmse
  point_estimate: per_repeat_pooled_then_mean

confirmatory:
  material: a
  target: capev_severity
  test: nadeau_bengio_corrected_t
  correction: holm
  alpha: 0.05
  contrasts:                     # difference = rmse(first) - rmse(second)
    - [A1, M0]
    - [A2, M0]
    - [A3, M0]
    - [A4, M0]
    - [A5, M0]
    - [A6, M0]
    - [A1, A3]
    - [A2, A3]
    - [A4, A3]
    - [A5, A3]
    - [A6, A3]
    - [A4, A2]
    - [A5, A2]
    - [A6, A2]
  bootstrap: {unit: group, n_resamples: 10000, ci_level: 0.95, method: percentile, seed: 20261103}
  equivalence_ci_level: 0.90

experiments:
  E1: {what: primary, material: a, targets: [capev_severity]}
  E2: {what: ssl_layer_curves, feature_sets: [A4, A5, A6], fixed_block: each, targets: all}
  E3: {what: secondary_targets, targets: secondary, contrasts: confirmatory, correction: holm_per_target}
  E4: {what: other_materials, materials: [i, sentences, whole], targets: [capev_severity]}
  E5:
    E5a: {subset: "recording_group == PT", drop_m0_columns: [group_BL, group_LA, group_NYU, group_PT, group_SJ]}
    E5b: {scheme: leave_one_recording_group_out}
    E5c: {by: sex, also_within_sex_cv: true}
    E5d: {target: capev_severity__session1}
    E5e:
      interval_flags: [glide, under_1s, low_confidence]
      recording_flags: {clip_fraction_above: 0.001, stereo: true}
      rater_sd_at_least: 20.0
    E5f: {feature_set: A3, sample_rate: native}
    E5g: {add: M0, contrasts: [[A1+M0, M0], [A2+M0, M0], [A3+M0, M0], [A4+M0, M0], [A5+M0, M0], [A6+M0, M0]]}
    E5h: {what: residual_vs_recording_group, test: kruskal_wallis}
    E5i: {groups: one_file_per_group}
    E5j: {what: missing_a_files_severity, test: mann_whitney_u}
  E6: {what: rater_ceiling, loro_weighting: per_pair, bootstrap: confirmatory}
  E7:
    what: mfcc_settings
    ablation: {n_ceps: [12, 6, 18], delta_order: [0, 1, 2], models: [ridge, svr]}
    model_tune: true
    n_repeats: 10
